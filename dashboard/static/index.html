<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge — The AI That Remembers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/design-system.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
</head>
<body class="intensity-balanced">
  <div class="grid-bg"></div>
  <div class="scan-sweep"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" id="brand-mark"></div>
        <div>
          <div class="brand-name gradient-text">FORGE</div>
          <div class="brand-sub">THE AI THAT REMEMBERS</div>
        </div>
      </div>
      <nav class="tabs" id="tabs"></nav>
      <div class="topbar-right">
        <span class="ticker">HERMES · 12 INSIGHTS LEARNED · READY</span>
        <span class="spark-status">
          <span class="dot d-green"></span> SPARK READY
        </span>
        <button class="icon-btn" title="Notifications">⎋</button>
        <button class="icon-btn" id="theme-toggle" title="Toggle light/dark mode">◐</button>
      </div>
    </header>

    <main id="view" class="content" data-screen-label="forge-view"></main>
  </div>

  <div class="intensity-pill" role="group" aria-label="Aesthetic intensity">
    <button data-intensity="tasteful">Tasteful</button>
    <button data-intensity="balanced" class="active">Balanced</button>
    <button data-intensity="full">Full Neon</button>
  </div>

  <script src="/static/js/data.js"></script>
  <script src="/static/js/video-player.js"></script>
  <script src="/static/js/hermes-panel.js"></script>
  <script src="/static/js/spark-widget.js"></script>
  <script src="/static/js/teach-mode.js"></script>
  <script src="/static/js/render-gallery.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
