<body> <div class="app" id="app"> <!-- ========== SIDEBAR RAIL ========== --> <aside class="rail" id="rail"> <div class="rail-brand"> <div class="mark">F</div> <div class="name">Forge</div> </div> <nav class="rail-nav" id="railNav"> <!-- items injected --> </nav> <div class="rail-foot"> <div class="rail-item" title="Help"> <span class="ico"> <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M8 8c0-1 1-2 2-2s2 1 2 2-2 1.5-2 3"/><circle cx="10" cy="14" r=".5" fill="currentColor"/></svg> </span> <span class="label">Help</span> </div> </div> </aside> <!-- ========== WORKSPACE ========== --> <div class="workspace"> <!-- TOPBAR --> <header class="topbar"> <div class="crumbs"> <span class="muted" id="crumbSection">Home</span> <span class="sep">/</span> <span class="current" id="crumbCurrent">Overview</span> </div> <div style="flex:1"></div> <div class="status-pill"> <span class="dot live"></span> <span>Hermes — 12 insights</span> </div> <div class="status-pill live"> <span class="dot live"></span> <span>Spark ready</span> </div> <button class="icon-btn" title="Search"> <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg> </button> <button class="icon-btn" title="Notifications"> <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8a5 5 0 0 1 10 0v3l1.5 3h-13L5 11z"/><path d="M8 16a2 2 0 0 0 4 0"/></svg> </button> </header> <!-- VIEW --> <main class="view" id="view"></main> </div> </div> <script> // ============================================================ // Routing & nav // ============================================================ const NAV = [ { id: 'home', label: 'Home', icon: home }, { id: 'characters', label: 'Characters', icon: people, meta: '3' }, { id: 'script', label: 'Script', icon: script }, /* { id: 'products', label: 'Products', icon: cube }, // v2 */ { id: 'renders', label: 'Renders', icon: grid, meta: '24' }, { id: 'memory', label: 'Memory', icon: brain, meta: '12' }, { id: 'settings', label: 'Settings', icon: gear } ]; // SVG icons function home(){return `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l7-6 7 6v8a1 1 0 0 1-1 1h-3v-5H7v5H4a1 1 0 0 1-1-1z"/></svg>`} function people(){return `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="3"/><path d="M2 17a5 5 0 0 1 10 0"/><circle cx="14" cy="7" r="2.5"/><path d="M13 13a4 4 0 0 1 5 4"/></svg>`} function script(){return `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="12" height="14" rx="1"/><path d="M7 7h6M7 10h6M7 13h4"/></svg>`} function cube(){return `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3l7 4v6l-7 4-7-4V7z"/><path d="M3 7l7 4 7-4M10 11v6"/></svg>`} function grid(){return `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg>`} function brain(){return `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 4a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7z"/><path d="M10 4v12M7 8h6M7 12h6"/></svg>`} function gear(){return `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="3"/><path d="M10 2v2m0 12v2M2 10h2m12 0h2M4.5 4.5l1.4 1.4m8.2 8.2 1.4 1.4M4.5 15.5l1.4-1.4m8.2-8.2 1.4-1.4"/></svg>`} // Build rail const railNav = document.getElementById('railNav'); NAV.forEach((n, i) => { const el = document.createElement('div'); el.className = 'rail-item' + (i===0 ? ' active' : ''); el.dataset.view = n.id; el.innerHTML = ` <span class="ico">${n.icon()}</span> <span class="label">${n.label}</span> ${n.meta ? `<span class="meta">${n.meta}</span>` : ''} `; el.addEventListener('click', () => navigate(n.id)); railNav.appendChild(el); }); // Pin behavior (rail is permanently expanded) function navigate(id) { document.querySelectorAll('.rail-item[data-view]').forEach(el => { el.classList.toggle('active', el.dataset.view === id); }); const item = NAV.find(n => n.id === id); document.getElementById('crumbSection').textContent = item.label; document.getElementById('crumbCurrent').textContent = SUBLABEL[id] || 'Overview'; document.getElementById('view').innerHTML = VIEWS[id](); document.getElementById('view').scrollTop = 0; // post-render hooks if (POST[id]) POST[id](); } const SUBLABEL = { home: 'Overview', characters: 'Elara', script: 'pilot_script.md', products: 'Emberdrive Mk-II', renders: 'Batch · 849271', memory: 'Knowledge graph', settings: 'Models' }; const VIEWS = {}; const POST = {}; // ============================================================ // Reusable bits // ============================================================ function placeholderSlash() { return `<div class="ph"></div>`; } // ============================================================ // HOME // ============================================================ VIEWS.home = () => ` <div class="view-inner"> <div class="view-header"> <div> <div class="eyebrow">Overview</div> <h1>Pipeline at a glance</h1> <div class="sub">Live events, render queue, and Hermes activity. Everything else is one click away.</div> </div> <div class="actions"> <button class="btn">Open last render</button> <button class="btn btn-primary">Start batch</button> </div> </div> <div class="home-now"> <div class="cell"> <div class="label">In flight</div> <div class="value">2</div> <div class="delta">SHOT_004 · VAR_009 · VAR_010</div> </div> <div class="cell"> <div class="label">Queued</div> <div class="value">14</div> <div class="delta">ETA ~ 6m 40s on Spark</div> </div> <div class="cell"> <div class="label">Anchor drift</div> <div class="value">0.04</div> <div class="delta">3 anchors locked · 0 flags</div> </div> </div> <div class="home-grid"> <div class="col gap-5"> <section class="panel processing"> <div class="panel-header"> <div class="title">Hermes — pipeline events</div> <div class="meta">streaming · /ws/hermes</div> </div> </section> <section class="panel"> <div class="panel-header"> <div class="title">Hermes — Creative Director</div> <div class="meta">agent · nous research</div> </div> <div class="panel-body"> <div class="chat-msg"> <div class="av agent">H</div> <div> <div class="head"><span class="name">Hermes</span></div> <div class="text"></div> </div> </div> </div> <div class="composer"> <input class="input" placeholder="Ask Hermes to write a shot, plan a campaign…" /> <button class="btn btn-primary">Send</button> </div> </section> </div> <aside class="col gap-5"> <section class="panel"> <div class="panel-header"><div class="title">Quick actions</div></div> <div class="quick-list"> <div class="qa"> <div class="ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="6,4 16,10 6,16" fill="currentColor" stroke="none"/></svg></div> <div class="body"><div class="title">Start batch</div><div class="desc">Dispatch 24 renders to Spark</div></div> <span class="chev">›</span> </div> <div class="qa"> <div class="ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="6"/><path d="M10 6v4l3 2"/></svg></div> <div class="body"><div class="title">Review anchors</div><div class="desc">Check character DNA integrity</div></div> <span class="chev">›</span> </div> <div class="qa"> <div class="ico"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h14v3H3zM3 9h14v3H3zM3 14h14v3H3z"/></svg></div> <div class="body"><div class="title">Open Spark output</div><div class="desc">node-02 · <div class="viewer"> <div class="frame-marks"></div> <div class="placeholder"> <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="0.6"> <circle cx="50" cy="38" r="14"/> <path d="M30 80 q20 -20 40 0"/> <line x1="50" y1="6" x2="50" y2="20" stroke-dasharray="2 2"/> </svg> </div> <div class="hud"> <div class="row"><span class="lbl">anchor</span> ELARA · pilot_anchor_v3</div> <div class="row"><span class="lbl">seed</span> 849021 <span class="lbl" style="margin-left:12px">res</span> 2560×1440</div> </div> </div> <div class="char-bottom"> <div class="consistency"> <span class="lbl">Consistency</span> <div class="bar progress"><div class="fill" style="width:94%"></div></div> <span class="pct">94%</span> </div> <button class="btn">Run audit</button> <button class="btn btn-primary">Render variations</button> </div> <!-- variation strip --> <div class="panel"> <div class="panel-header"> <div class="title">Variations</div> <div class="row gap-2"> <div class="segmented"> <button class="active">All · 24</button> <button>Pose · 8</button> <button>Lighting · 6</button> <button>Best · 11</button> </div> </div> </div> <div class="panel-body"> <div class="var-strip"> ${[1,2,3,4,5,6,7].map(i => ` <div class="var-thumb"> <div class="ph"></div> <span class="tag">ELARA_V0${i}</span> </div> `).join('')} </div> </div> </div> </div> <!-- ASIDE --> <aside class="chars-aside"> <div class="panel-header"> <div class="title">Character DNA</div> <div class="meta">v3 · 14 revs</div> </div> <div class="body"> <div class="dna-block"> <div class="h">Hair</div> <div class="v">Platinum crop, undercut left side, singed tips from the Hollow.</div> </div> <div class="dna-block"> <div class="h">Eyes</div> <div class="v">Pale amber, reflective — pupils dilate in low light.</div> </div> <div class="dna-block"> <div class="h">Build</div> <div class="v">Lean, 5'8", defined shoulders from high-g maneuvers.</div> </div> <div class="dna-block"> <div class="h">Clothing</div> <div class="v">Charcoal flight jacket over graphite undersuit, copper piping along seams.</div> </div> <div class="dna-block"> <div class="h">Signature</div> <div class="v">Left forearm: ember-glow tattoo — a spiralling sigil, always visible.</div> </div> <div class="dna-block"> <div class="h">Palette</div> <div class="palette-row"> <div class="palette-chip" style="background:#D4B896"></div> <div class="palette-chip" style="background:#3A3D45"></div> <div class="palette-chip" style="background:#C77A2E"></div> <div class="palette-chip" style="background:#1F2026"></div> <div class="palette-chip" style="background:#8E6B3D"></div> </div> </div> </div> </aside> </div> </div> `; // ============================================================ // SCRIPT // ============================================================ VIEWS.script = () => ` <div class="view-inner"> <div class="view-header"> <div> <div class="eyebrow">Script</div> <h1>pilot_script.md</h1> <div class="sub">8 shots · 3 characters detected</div> </div> <div class="actions"> <button class="btn">Reparse</button> <button class="btn">Add shot</button> <button class="btn btn-primary">Queue all shots</button> </div> </div> <div class="script-shell"> <!-- side --> <aside class="script-side"> <div class="panel-header"> <div class="title">Scripts</div> <button class="icon-btn"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 4v12M4 10h12"/></svg></button> </div> <div class="char-item active" style="border-bottom:1px solid var(--border)"> <div class="av" style="background:var(--accent-soft);border-color:var(--accent-line)"></div> <div><div class="name">pilot_script.md</div><div class="role">8 shots · active</div></div> <span></span> </div> <div class="char-item"> <div class="av"></div> <div><div class="name">teaser_v2.md</div><div class="role">4 shots</div></div> <span></span> </div> <div class="char-item"> <div class="av"></div> <div><div class="name">launch_spot.md</div><d haracter-tag">VEX-09</span></span><span><span class="status-pill-sm running"><span class="dot live"></span>Running</span></span><span class="preview">Macro product detail — Vex-09 on brushed aluminum surface, studio rim light…</span><span class="duration">2.0s</span></div> <div class="shot-row"><span class="num">05</span><span class="id">SHOT_005</span><span class="chars"><span class="character-tag">ELARA</span></span><span><span class="status-pill-sm queued">Queued</span></span><span class="preview">Cinematic noir — Elara in a rain-soaked alley, single streetlamp key light…</span><span class="duration">3.6s</span></div> <div class="shot-row"><span class="num">06</span><span class="id">SHOT_006</span><span class="chars"><span class="character-tag">ORIN</span></span><span><span class="status-pill-sm queued">Queued</span></span><span class="preview">Pop-art portrait — Orin against a saturated yellow background, bold outlines…</span><span class="duration">2.4s</span></div> <div class="shot-row"><span class="num">07</span><span class="id">SHOT_007</span><span class="chars"><span class="character-tag">ELARA</span><span class="character-tag">VEX-09</span></span><span><span class="status-pill-sm failed"><span class="dot error"></span>Failed</span></span><span class="preview">Architectural interior — Elara and Vex-09 in a mid-century modern living roo…</span><span class="duration">3.0s</span></div> <div class="shot-row"><span class="num">08</span><span class="id">SHOT_008</span><span class="chars"><span class="character-tag">ELARA</span></span><span><span class="status-pill-sm queued">Queued</span></span><span class="preview">Fantasy watercolor — Elara in an enchanted forest, soft bleeding edges, lumi…</span><span class="duration">4.4s</span></div> </div> </div> <div class="inspector"> <div class="panel-header"> <div class="title">Hermes — Screenwriter</div> <div class="meta">agent · nous research</div> </div> <div class="body"> <div class="chat-msg"> <div class="av agent">
