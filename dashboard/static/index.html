<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinesmith - The AI That Remembers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/design-system.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <script src="https://unpkg.com/cytoscape@3.26.0/dist/cytoscape.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail">
      <div class="rail-brand">
        <div class="mark">F</div>
        <div class="name">Cinesmith</div>
      </div>
      <nav class="rail-nav" id="railNav"></nav>
      <div class="rail-foot">
        <div class="rail-item" title="Help">
          <span class="ico">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="7"/><path d="M8 8c0-1 1-2 2-2s2 1 2 2-2 1.5-2 3"/><circle cx="10" cy="14" r=".5" fill="currentColor"/></svg>
          </span>
          <span class="label">Help</span>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="crumbs">
          <span class="muted" id="crumbSection">Home</span>
          <span class="sep">/</span>
          <span class="current" id="crumbCurrent">Overview</span>
        </div>
        <div style="flex:1"></div>
        <div class="status-pill">
          <span class="dot live"></span>
          <span>Hermes - 12 insights</span>
        </div>
        <div class="status-pill live">
          <span class="dot live"></span>
          <span>Spark ready</span>
        </div>
        <button class="icon-btn" title="Search">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
        </button>
        <button class="icon-btn" title="Notifications">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 8a5 5 0 0 1 10 0v3l1.5 3h-13L5 11z"/><path d="M8 16a2 2 0 0 0 4 0"/></svg>
        </button>
      </header>
      <main class="view" id="view"></main>
    </div>
  </div>

  <script>
    const NAV = [
      { id: "home", label: "Home", icon: home },
      { id: "characters", label: "Characters", icon: people, meta: "3" },
      { id: "script", label: "Script", icon: script },
      { id: "products", label: "Products", icon: box },
      { id: "spark", label: "Spark", icon: grid, meta: "24" },
      { id: "memory", label: "Memory", icon: brain, meta: "12" },
      { id: "settings", label: "Settings", icon: gear },
    ];

    function home() { return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l7-6 7 6v8a1 1 0 0 1-1 1h-3v-5H7v5H4a1 1 0 0 1-1-1z"/></svg>'; }
    function people() { return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="3"/><path d="M2 17a5 5 0 0 1 10 0"/><circle cx="14" cy="7" r="2.5"/><path d="M13 13a4 4 0 0 1 5 4"/></svg>'; }
    function script() { return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="3" width="12" height="14" rx="1"/><path d="M7 7h6M7 10h6M7 13h4"/></svg>'; }
    function box() { return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3.5 6.5 10 3l6.5 3.5v7L10 17l-6.5-3.5v-7z"/><path d="M3.8 6.7 10 10l6.2-3.3M10 10v7"/></svg>'; }
    function grid() { return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/></svg>'; }
    function brain() { return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 4a3 3 0 0 0-3 3v6a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7z"/><path d="M10 4v12M7 8h6M7 12h6"/></svg>'; }
    function gear() { return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="3"/><path d="M10 2v2m0 12v2M2 10h2m12 0h2M4.5 4.5l1.4 1.4m8.2 8.2 1.4 1.4M4.5 15.5l1.4-1.4m8.2-8.2 1.4-1.4"/></svg>'; }

    const railNav = document.getElementById("railNav");
    NAV.forEach((n, i) => {
      const el = document.createElement("div");
      el.className = "rail-item" + (i === 0 ? " active" : "");
      el.dataset.view = n.id;
      el.innerHTML = '<span class="ico">' + n.icon() + '</span><span class="label">' + n.label + '</span>' + (n.meta ? '<span class="meta">' + n.meta + '</span>' : '');
      el.addEventListener("click", () => window.navigate ? window.navigate(n.id) : null);
      railNav.appendChild(el);
    });
  </script>

  <script src="/static/js/data.js"></script>
  <script src="/static/js/video-player.js"></script>
  <script src="/static/js/hermes-panel.js"></script>
  <script src="/static/js/spark-widget.js"></script>
  <script src="/static/js/render-gallery.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
